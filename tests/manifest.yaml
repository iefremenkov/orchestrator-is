# Single source of truth for how each tests/*.sh file is executed and by whom, across
# scripts/dispatch.py (per-attempt attestation). See CLAUDE.md T1/R26 and the attestation
# redesign (dev-box report on SPEC-018) for why one flat "run everything in the worker sandbox"
# model does not work: some tests need things the isolated worker CANNOT have (sudo, the
# operator's own resolvable git checkout) and giving it those things would BE the security hole
# these tests exist to rule out.
#
# Categories:
#   sandbox                - runs inside the isolated worker's own test-phase unit, unchanged.
#   prelaunch               - needs sudo + the codex-worker system user to make its OWN
#                             assertions. Run by the orchestrator itself, from ITS OWN installed
#                             copy (never the worktree's), once per launch, BEFORE any worker
#                             code runs or any worktree for this attempt exists. A worker can
#                             never influence this result.
#   sandbox_venv_override   - runs inside the worker sandbox like `sandbox`, but needs a working
#                             Python venv (pyyaml, jsonschema) that a fresh worktree does not have
#                             (.venv/ is gitignored). The orchestrator's own .venv is bind-mounted
#                             in read-only for this alone; $ORCH_VENV tells the test where to
#                             find it as a fallback when its own local .venv is absent.
#   operator_read           - reads the candidate's own tracked files (git history, prose,
#                             comments) to check repo conventions. Needs a real, resolvable git
#                             checkout, which a linked worktree's .git file cannot provide from
#                             inside the isolated worker (it points back into the operator's
#                             home, which is deliberately unreachable there). Run by the
#                             orchestrator directly, using ITS OWN installed copy of the test
#                             (never the worktree's — same anti-tamper principle as `prelaunch`),
#                             pointed at the candidate's worktree via $ORCH_TARGET_DIR. A plain
#                             read: it never executes anything the worker wrote.

sandbox:
  - tests/auto_resume_watchdog.sh
  - tests/capitalize.sh
  - tests/codex_plan.sh
  - tests/intake_gate.sh
  - tests/lower.sh
  - tests/repeat.sh
  - tests/reverse.sh
  - tests/review_cap.sh
  - tests/rulebook_cap.sh
  - tests/slugify.sh
  - tests/smoke.sh
  - tests/squeeze.sh
  - tests/test_attestation.sh
  - tests/trim.sh
  - tests/upper.sh

prelaunch:
  - tests/worker_isolation.sh
  - tests/worker_userns.sh

sandbox_venv_override:
  - tests/dispatch_gate4.sh
  - tests/dispatch_parallel.sh
  - tests/isolation_fail_closed.sh
  - tests/scope_glob.sh

operator_read:
  - tests/plain_language.sh
  - tests/prose_cap.sh
